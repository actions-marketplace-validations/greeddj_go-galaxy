# Ten widely used Galaxy roles with no role dependencies between them, so a
# --no-deps install measures fetch plus extract over one flat set, as the
# collection files beside this one do.
roles:
  - geerlingguy.docker
  - geerlingguy.pip
  - geerlingguy.git
  - geerlingguy.ntp
  - geerlingguy.nginx
  - geerlingguy.redis
  - geerlingguy.java
  - geerlingguy.nodejs
  - geerlingguy.postgresql
  - geerlingguy.security
