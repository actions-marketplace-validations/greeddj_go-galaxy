version: 2
updates:
  # Go module dependencies (go.mod / go.sum). The repository builds in module
  # mode; vendor/ is git-ignored, so Dependabot updates go.mod/go.sum only.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch non-breaking bumps into one PR to cut review noise; majors stay
      # separate so a breaking bump is reviewed on its own.
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
