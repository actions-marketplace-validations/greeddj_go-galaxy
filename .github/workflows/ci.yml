name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Callable so the release workflow gates a tag on the same checks a pull
  # request gets, instead of on a second, drifting copy of them.
  workflow_call:

jobs:
  tests_and_checks:
    name: Tests and Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Run check
        run: |
          go vet ./...;
          go tool staticcheck ./...;
          go tool govulncheck ./...;
          go tool fieldalignment ./...;

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: binary

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
