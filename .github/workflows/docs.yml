name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'

jobs:
  prose:
    name: Prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run prose audit
        run: go test ./internal/proseaudit/
