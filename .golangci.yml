version: "2"
linters:
  default: all
  disable:
    - wsl
    - wsl_v5
    - wrapcheck
    - varnamelen
    - tagliatelle
    - noinlineerr
    - nlreturn
    - nilerr
    - ireturn
    - exhaustruct
    - testpackage
    - paralleltest
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            # Standard library, but outside depguard's own $gostd expansion,
            # which does not cover the go/ tree. Used only by the three
            # source-auditing test packages: internal/proseaudit (comments
            # against the code they cite), internal/lockaudit (the holder
            # context's threading through each command's lifecycle), and
            # internal/galaxy/store's own dirty-flag audit (every write-locked
            # *Store method setting the dirty flag).
            - go/ast
            - go/parser
            - go/token
            - github.com/greeddj/go-galaxy
            - github.com/Masterminds/semver/v3
            - github.com/briandowns/spinner
            - github.com/klauspost/pgzip
            - github.com/psvmcc/hub
            - github.com/urfave/cli/v3
            - go.etcd.io/bbolt
            - go.yaml.in/yaml/v3
    lll:
      line-length: 140
    musttag:
      # musttag keys its built-in list of (de)serializers by module path, so
      # the YAML entry points it knows are gopkg.in/yaml.v3's. Naming the fork
      # this module actually imports keeps every yaml.Marshal/yaml.Unmarshal
      # call in scope; without these two entries the linter goes quiet on them
      # rather than failing, which is the shape of coverage loss nothing
      # announces. Same two functions and argument positions as the built-in
      # pair they stand in for.
      functions:
        - name: go.yaml.in/yaml/v3.Marshal
          tag: yaml
          arg-pos: 0
        - name: go.yaml.in/yaml/v3.Unmarshal
          tag: yaml
          arg-pos: 1
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        text: 'package-comments: should have a package comment'
      - linters:
          - staticcheck
        text: at least one file in a package should have a package comment
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
